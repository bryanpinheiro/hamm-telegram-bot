services:
  telegrambot:
    build: .
    container_name: telegrambot
    restart: unless-stopped
    volumes:
      - /home/opc/bot-data:/app/data:Z
      - ./logs:/app/logs:Z
    ports:
      - "127.0.0.1:7001:8000"  # Prometheus metrics port
      - "127.0.0.1:7002:8001"  # Logs port
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=${METRICS_PUBLIC_URL:-http://localhost:9091}/prometheus/'
      - '--web.route-prefix=/'
    networks:
      - monitoring
    depends_on:
      - telegrambot

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3701:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${METRICS_PUBLIC_URL:-http://localhost:3701}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: